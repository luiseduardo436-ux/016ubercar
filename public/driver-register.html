<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de motorista | 016 Ubercar</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/roles.css"><link rel="stylesheet" href="/driver-register.css"></head><body><main class="role-shell register-shell"><header class="role-header"><a class="brand dark" href="/">016 <span>ubercar</span></a><a class="role-tag" href="/driver.html">Já sou motorista</a></header><section class="register-card"><p class="eyebrow">Cadastro de parceiro</p><h1 class="role-title">Dirija com<br><em>a gente.</em></h1><p class="register-copy">Envie seus dados. A equipe 016 Ubercar analisa o cadastro e avisa quando estiver aprovado.</p><form id="register"><div class="form-grid"><label>Nome completo<input name="name" required placeholder="Ex.: Marcos Almeida"></label><label>Telefone<input name="phone" required placeholder="(16) 99999-9999"></label><label>Cidade<input name="city" list="cities" required placeholder="Ribeirão Preto - SP"></label><label>Placa<input name="plate" required placeholder="ABC1D23" maxlength="7"></label><label class="wide">Modelo do veículo<input name="vehicle" required placeholder="Ex.: Chevrolet Onix 2022"></label></div><datalist id="cities"><option value="Ribeirão Preto - SP"><option value="Sertãozinho - SP"><option value="Serrana - SP"><option value="Cravinhos - SP"><option value="Batatais - SP"><option value="Franca - SP"><option value="Barretos - SP"></datalist><label class="document">CNH e documento do veículo<input id="documents" type="file" multiple accept="image/*,.pdf"><small>Você poderá anexar os documentos na próxima etapa.</small></label><button class="primary" type="submit">Enviar cadastro <span>→</span></button><p id="feedback" class="register-feedback"></p></form></section></main><script src="/driver-register.js"></script></body></html>
