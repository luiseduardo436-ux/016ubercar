services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: 016ubercar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ubercar
      POSTGRES_USER: ubercar
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: 016ubercar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
